    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var key = "scriptora-performance-mode";
          var v = localStorage.getItem(key);
          if (v === "true") v = "performance";
          else if (v === "false") v = "premium";
          else if (v !== "balanced" && v !== "performance" && v !== "premium") v = "premium";
          var root = document.documentElement;
          root.classList.add("scriptora-visual-" + v);
          if (v === "balanced" || v === "performance") root.classList.add("scriptora-performance-mode");
          if (v === "performance") root.classList.add("scriptora-turbo-mode");
        } catch (e) {}
      })();
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
